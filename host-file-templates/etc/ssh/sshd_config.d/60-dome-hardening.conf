# Dome cloud-box sshd hardening (F15.1, F15.7).
# Installed to /etc/ssh/sshd_config.d/ by scripts/bare-metal-base.sh when
# DOME_TARGET=cloud, and removed on any other target. Ubuntu's image defaults
# allow agent and X11 forwarding; nothing in this project's workflow uses
# either.
#
# AllowTcpForwarding is deliberately NOT disabled: `ssh -L` is how Foxglove and
# tunnel-mode VNC reach the box, and that is port forwarding, not agent
# forwarding.

# A forwarded agent is a signing oracle. The laptop key is simultaneously the
# GitHub key and the robot key, so one `ssh -A` to a compromised box would let
# it sign as you against the org — and the robot runs what the org serves.
AllowAgentForwarding no

# `ssh -X` to a hostile box is a keylogger. XQuartz is not installed on the
# Mac today, which is what closes this; the directive is what keeps it closed
# if that ever changes.
X11Forwarding no

# The OCI image's root key carries a forced command, so this is defense in
# depth rather than a fix.
PermitRootLogin no
