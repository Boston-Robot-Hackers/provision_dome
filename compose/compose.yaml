# Source dome-config.sh before running docker compose so DOME_BASE_IMAGE,
# DOME_IMAGE, and DOME_USER are set from manifest/config.txt.
# The fallback values below are last-resort placeholders only.
services:
  dome:
    build:
      context: .
      ssh:
        - default
      args:
        DOME_BASE_IMAGE: ${DOME_BASE_IMAGE:-dome-docker-base:kilted}
        DOME_USER: ${DOME_USER:-robot}
        DOME_PASSWORD: ${DOME_PASSWORD:-}
        REPOS_CONFIG: ${REPOS_CONFIG:-DOME}
    image: ${DOME_IMAGE:-dome-docker:dome-kilted}
    container_name: dome
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      DOME_HOME: /home/${DOME_USER:-robot}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./runtime-data/ros:/home/${DOME_USER:-robot}/.ros
      - ./runtime-data/control:/home/${DOME_USER:-robot}/.control
      - ./runtime-data/dome:/home/${DOME_USER:-robot}/.dome
      - ./runtime-data/config:/home/${DOME_USER:-robot}/.config
    device_cgroup_rules:
      - 'c 189:* rmw'
    devices:
      - /dev/dma_heap:/dev/dma_heap
    command: bash
